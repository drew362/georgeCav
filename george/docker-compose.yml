services:
  # Бэкенд Spring Boot
  api-backend:
    build: .
    container_name: aquilon_backend
    ports:
      - "8086:8086"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_db:5432/Search2
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: always


  postgres_db:
    image: postgres:17-alpine
    container_name: aquilon_postgres
    ports:
      - "5432:5432"
    # - "5433:5432" #local
    environment:
      - POSTGRES_DB=Search2
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Search2"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  pgdata:
